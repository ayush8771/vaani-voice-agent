<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Vaani</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<div class="login-shell">
    <section class="login-card">
        <div class="login-brand">
            <span class="identity-badge" aria-hidden="true">V</span>
            <div>
                <p class="eyebrow">Reservation Operations</p>
                <h2>Admin Access</h2>
            </div>
        </div>

        {% if no_admins %}
        <div class="error-msg" role="status">
            No admin accounts exist yet. Create the first one from a terminal:
            <code>python manage.py create-admin --role owner</code>
        </div>
        {% else %}
        <p>Sign in with your admin account.</p>
        {% endif %}

        <form method="POST" class="login-form" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username"
                   required maxlength="60" autofocus>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password"
                   required maxlength="200">

            <label for="otp">Authenticator code <span class="hint">(only if two-factor is on)</span></label>
            <input id="otp" type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}"
                   maxlength="6" autocomplete="one-time-code" placeholder="123456">

            <button type="submit" class="primary-btn">Login</button>
        </form>

        {% if error %}
        <div class="error-msg" role="alert">{{ error }}</div>
        {% endif %}

        <a href="/" class="back-link">← Back to assistant</a>
    </section>
</div>

</body>
</html>
